# separate terms of service, privacy policy, and support
# documentation.

name: Flutter Build

env:
  FLUTTER_VERSION: 3.50.1
  # Signed artifacts are produced only for version tags and manual dispatch; PR/main builds remain unsigned.
  SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  ALLOW_SELF_SIGNED_SIGNATURES: ${{ vars.ALLOW_SELF_SIGNED_SIGNATURES || 'true' }}

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}
      - name: Prepare Android signing
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/ci/prepare_android_signing.sh
      - run: flutter clean
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - name: Verify signed Android artifacts
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash scripts/ci/verify_android_artifacts.sh
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-android-aab-signed' || 'free_rfr-android-aab' }}
          path: build/app/outputs/bundle/release/
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-android-apk-signed' || 'free_rfr-android-apk' }}
          path: build/app/outputs/flutter-apk/
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev keybinder-3.0
      - run: flutter build linux --release
      - name: Sign Linux artifacts
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: bash scripts/ci/sign_linux.sh
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-linux-signed' || 'free_rfr-linux' }}
          path: build/linux/x64/release/bundle
      - name: Upload Linux signature
        if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: free_rfr-linux-signature
          path: |
            build/linux/x64/release/free_rfr-linux.tar.gz
            build/linux/x64/release/free_rfr-linux.tar.gz.asc
      - name: Remove Android signing files
        if: always() && env.SIGN_RELEASE == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/free_rfr-upload.jks" android/key.properties
      #- run: flutter test
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Sign Windows binaries
        if: env.SIGN_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          ALLOW_SELF_SIGNED_SIGNATURES: ${{ env.ALLOW_SELF_SIGNED_SIGNATURES }}
        run: .\scripts\ci\sign_windows.ps1
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-windows-signed' || 'free_rfr-windows' }}
          path: build/windows/x64/runner/Release/
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: Build unsigned IPA
        if: env.SIGN_RELEASE != 'true'
        run: flutter build ipa --release --no-codesign
      - name: Build signed IPA
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'app-store' }}
        run: bash scripts/ci/export_ios_ipa.sh
      - run: flutter build macos --release
      - name: Sign macOS app
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash scripts/ci/sign_macos_app.sh
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-macos-signed' || 'free_rfr-macos' }}
          path: build/macos/Build/Products/Release
      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-ios-signed' || 'free_rfr-ios' }}
          path: build/ios/ipa
