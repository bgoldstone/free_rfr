# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter Build

env:
  FLUTTER_VERSION: 3.50.1
  # Signed artifacts are produced only for version tags and manual dispatch; PR/main builds remain unsigned.
  SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}
      - name: Prepare Android signing
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Materialize the base64-encoded upload keystore into a temporary file that Android Gradle can read during this job only.
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              exit 1
            fi
          done

          keystore="$RUNNER_TEMP/free_rfr-upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"

          # key.properties is a Java properties file, so backslashes and colons in secrets and paths need escaping.
          ANDROID_KEYSTORE_PATH="$keystore" python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              return value.replace("\\", "\\\\").replace(":", "\\:")

          lines = [
              f"storePassword={escape(os.environ['ANDROID_KEYSTORE_PASSWORD'])}",
              f"keyPassword={escape(os.environ['ANDROID_KEY_PASSWORD'])}",
              f"keyAlias={escape(os.environ['ANDROID_KEY_ALIAS'])}",
              f"storeFile={escape(os.environ['ANDROID_KEYSTORE_PATH'])}",
          ]
          Path("android/key.properties").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          chmod 600 android/key.properties
      - run: flutter clean
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter build appbundle --release
      - run: flutter build apk --release
      - name: Verify signed Android artifacts
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          # Prove the AAB and APK were signed by the same upload key by comparing normalized SHA-256 certificate fingerprints.
          keystore="$RUNNER_TEMP/free_rfr-upload.jks"
          aab=$(find build/app/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)
          apk=$(find build/app/outputs/flutter-apk -maxdepth 1 -name '*.apk' -print -quit)
          if [ -z "$aab" ] || [ -z "$apk" ]; then
            echo "::error::Signed Android artifacts were not found"
            exit 1
          fi

          # keytool and apksigner print fingerprints with different separators and casing, so normalize before comparing.
          normalize() {
            tr -d ':' | tr '[:lower:]' '[:upper:]'
          }
          expected=$(keytool -list -v -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/ {print $2; exit}' | normalize)
          aab_cert=$(keytool -printcert -jarfile "$aab" | awk -F': ' '/SHA256:/ {print $2; exit}' | normalize)

          # apksigner is versioned under build-tools, so resolve the installed path instead of assuming a fixed SDK version.
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "::error::Android SDK path is not available"
            exit 1
          fi
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print -quit)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi

          # jarsigner validates the AAB JAR signature; apksigner validates the APK signature schemes and exposes its certificate digest.
          jarsigner -verify "$aab"
          "$apksigner" verify --print-certs "$apk"
          apk_cert=$("$apksigner" verify --print-certs "$apk" | awk '/SHA-256 digest/ {print $NF; exit}' | normalize)

          if [ -z "$expected" ] || [ "$expected" != "$aab_cert" ] || [ "$expected" != "$apk_cert" ]; then
            echo "::error::Android artifacts were not signed with the expected certificate"
            exit 1
          fi
      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-android-aab-signed' || 'free_rfr-android-aab' }}
          path: build/app/outputs/bundle/release/
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-android-apk-signed' || 'free_rfr-android-apk' }}
          path: build/app/outputs/flutter-apk/
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev keybinder-3.0
      - run: flutter build linux --release
      - name: Sign Linux artifacts
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # GitHub Actions artifacts are not code-signed; publish a detached GPG signature for the Linux release archive so downloads can be verified.
          for secret in GPG_PRIVATE_KEY_BASE64 GPG_PASSPHRASE; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              exit 1
            fi
          done

          # Import the CI key, archive the release bundle, then pass the passphrase on stdin so it never appears in process arguments.
          printf '%s' "$GPG_PRIVATE_KEY_BASE64" | base64 --decode | gpg --batch --import
          archive="$RUNNER_TEMP/free_rfr-linux.tar.gz"
          signature="$RUNNER_TEMP/free_rfr-linux.tar.gz.asc"
          tar -czf "$archive" -C build/linux/x64/release bundle
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign --output "$signature" "$archive"
          gpg --verify "$signature" "$archive"
          mv "$archive" "$signature" build/linux/x64/release/
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-linux-signed' || 'free_rfr-linux' }}
          path: build/linux/x64/release/bundle
      - name: Upload Linux signature
        if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: free_rfr-linux-signature
          path: |
            build/linux/x64/release/free_rfr-linux.tar.gz
            build/linux/x64/release/free_rfr-linux.tar.gz.asc
      - name: Remove Android signing files
        if: always() && env.SIGN_RELEASE == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/free_rfr-upload.jks" android/key.properties
      #- run: flutter test
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Import Windows signing certificate
        if: env.SIGN_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          # Decode the base64 PFX to a temporary file and expose the path through GITHUB_ENV for the signing step.
          if (-not $env:WINDOWS_PFX_BASE64) { throw 'Missing required secret: WINDOWS_PFX_BASE64' }
          if (-not $env:WINDOWS_PFX_PASSWORD) { throw 'Missing required secret: WINDOWS_PFX_PASSWORD' }

          $pfx = Join-Path $env:RUNNER_TEMP 'free_rfr-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          "WINDOWS_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Sign Windows binaries
        if: env.SIGN_RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          # Use the newest installed Windows SDK signtool.exe, sign every PE file in the Flutter release folder, then verify all signatures.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe was not found' }

          $files = @(Get-ChildItem -LiteralPath 'build/windows/x64/runner/Release' -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.dll') })
          if ($files.Count -eq 0) { throw 'No Windows executables were found' }

          & $signtool sign /fd SHA256 /f $env:WINDOWS_PFX_PATH /p $env:WINDOWS_PFX_PASSWORD $files.FullName
          & $signtool verify /pa $files.FullName
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-windows-signed' || 'free_rfr-windows' }}
          path: build/windows/x64/runner/Release/
      - name: Remove Windows signing certificate
        if: always() && env.SIGN_RELEASE == 'true'
        shell: pwsh
        run: |
          if ($env:WINDOWS_PFX_PATH -and (Test-Path -LiteralPath $env:WINDOWS_PFX_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_PFX_PATH -Force
          }
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: Build unsigned IPA
        if: env.SIGN_RELEASE != 'true'
        run: flutter build ipa --release --no-codesign
      - name: Build signed IPA
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'app-store' }}
        run: |
          set -euo pipefail
          # Import the P12 and provisioning profile into a temporary keychain because Flutter emits an unsigned archive that xcodebuild exports.
          for secret in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME IOS_TEAM_ID; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/free-rfr-ios.keychain-db"
          certificate="$RUNNER_TEMP/ios-signing.p12"
          profile="$RUNNER_TEMP/free_rfr.mobileprovision"
          options="$RUNNER_TEMP/ExportOptions.plist"
          keychain_password='free-rfr-ios-keychain'

          # Decode signing material to temporary files and add the keychain to the user search list for codesign/xcodebuild.
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" $existing
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/free_rfr.mobileprovision"

          # ExportOptions.plist tells xcodebuild which team, profile, and distribution method to use for the unsigned archive.
          export IOS_EXPORT_OPTIONS_PATH="$options"
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": os.environ["IOS_EXPORT_METHOD"],
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {
                  "com.github.bgoldstone.free_rfr": os.environ["IOS_PROVISIONING_PROFILE_NAME"]
              },
          }
          with open(os.environ["IOS_EXPORT_OPTIONS_PATH"], "wb") as file:
              plistlib.dump(options, file)
          PY

          # Building with --no-codesign creates the archive; exportArchive applies the imported identity and profile to produce the signed IPA.
          flutter build ipa --release --no-codesign
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$options" \
            -exportPath build/ios/ipa

          # Verify the embedded app inside the exported IPA, not just the archive, because exportArchive rewrites the signature.
          ipa=$(find build/ios/ipa -maxdepth 2 -name '*.ipa' -print -quit)
          if [ -z "$ipa" ]; then
            echo "::error::Signed IPA was not found"
            exit 1
          fi
          unzip -q "$ipa" -d "$RUNNER_TEMP/ios-ipa"
          app=$(find "$RUNNER_TEMP/ios-ipa/Payload" -maxdepth 1 -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"

          security delete-keychain "$keychain" || true
          rm -f "$certificate" "$profile" "$options"
      - run: flutter build macos --release
      - name: Sign macOS app
        if: env.SIGN_RELEASE == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Import the Developer ID certificate into a temporary keychain so codesign can use it without modifying the runner's default keychain.
          for secret in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY; do
            if [ -z "${!secret}" ]; then
              echo "::error::Missing required secret: $secret"
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/free-rfr-macos.keychain-db"
          certificate="$RUNNER_TEMP/macos-signing.p12"
          keychain_password='free-rfr-macos-keychain'

          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          existing=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" $existing

          # Flutter's release build may already be ad-hoc signed, so force a Developer ID signature with the hardened runtime option.
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then
            echo "::error::macOS app was not found"
            exit 1
          fi
          codesign --force --deep --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          security delete-keychain "$keychain" || true
          rm -f "$certificate"
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-macos-signed' || 'free_rfr-macos' }}
          path: build/macos/Build/Products/Release
      - name: Archive IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGN_RELEASE == 'true' && 'free_rfr-ios-signed' || 'free_rfr-ios' }}
          path: build/ios/ipa
